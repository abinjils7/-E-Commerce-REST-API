services:
  mongo:
    image: mongo:7.0
    container_name: ecom-mongo
    restart: unless-stopped
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            if (rs.status().myState === 1) {
              quit(0);
            }
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongo:27017' }]
            });
          }
          quit(1);
        "
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecom-app:latest
    container_name: ecom-api
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/ecom?replicaSet=rs0
      - MONGO_URI=mongodb://mongo:27017/ecom?replicaSet=rs0
      - USE_TRANSACTIONS=true
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long_for_security}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-12}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminPassword123!}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - AUTH_RATE_LIMIT_WINDOW_MS=${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-30}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  seed:
    image: ecom-app:latest
    container_name: ecom-seed
    command: [ "node", "dist/scripts/seed.js" ]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/ecom?replicaSet=rs0
      - MONGO_URI=mongodb://mongo:27017/ecom?replicaSet=rs0
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminPassword123!}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-12}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo_data:
